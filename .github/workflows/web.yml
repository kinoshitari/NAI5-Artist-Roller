name: Build HTML and Web App

on:
  push:
    branches: [main, 'web/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Verify the desktop and Android web build
        run: npm run build
      - name: Build self-contained HTML and offline web app
        id: build
        run: npm run build:pwa
      - name: Verify the committed HTML is current
        run: git diff --exit-code -- release/NAI5-Artist-Roller-Offline.html release/NAI5-Artist-Roller-Offline.html.sha256
      - name: Install browser engines
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium acceptance checks
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:browser -- --browser chromium
      - name: WebKit acceptance checks
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:browser -- --browser webkit
      - name: Browser reports and screenshots
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa-results/
          retention-days: 30
      - name: Downloadable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: NAI5-Artist-Roller-Offline-HTML
          path: |
            release/NAI5-Artist-Roller-Offline.html
            release/NAI5-Artist-Roller-Offline.html.sha256
          retention-days: 90
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pwa

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish web app
        id: deployment
        uses: actions/deploy-pages@v4
